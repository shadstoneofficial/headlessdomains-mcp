[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "headlessdomains-chatgpt-plugin"
version = "0.1.0"
description = "Read-only HeadlessDomains MCP tools and MCP App entrypoints for ChatGPT."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "mcp>=2.2,<3",
  "openai-mcp-extensions>=0.1,<0.2",
  "pydantic>=2.12,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
headlessdomains-chatgpt-plugin = "headlessdomains_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
headlessdomains_mcp = ["app.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

